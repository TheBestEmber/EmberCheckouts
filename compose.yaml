services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ember_checkouts
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember -d ember_checkouts"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"

  migrate:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - ./migrations:/migrations:ro
    command:
      - sh
      - -ec
      - for migration in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h db -U ember -d ember_checkouts -f "$$migration"; done
    restart: "no"

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://ember:${POSTGRES_PASSWORD:-local-development-only}@db:5432/ember_checkouts?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      EMBER_AUTH_URL: ${EMBER_AUTH_URL:-http://127.0.0.1:8081}
      EMBER_AUTH_JWKS_URL: ${EMBER_AUTH_JWKS_URL:-http://host.docker.internal:8081/.well-known/jwks.json}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
